name: CodeTrace_CI

on:
    pull_request:
        branches:
            - main
    
    push:
        branches:
            - main

permissions:
    contents: read

env:
    DB_HOST: 127.0.0.1
    DB_PORT: "5432"
    DB_NAME: codetrace_db
    DB_USER: codetrace_db_user
    DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

jobs:
    test:
        name: Test (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                python-version:
                    - "3.11"
                    - "3.12"
                    - "3.13"
        
        services:
            db:
                image: timescale/timescaledb:latest-pg16
                env:
                    POSTGRES_DB: codetrace_db
                    POSTGRES_USER: codetrace_db_user
                    POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U codetrace -d codetrace"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
                    --health-start-period 10s

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: ${{ matrix.python-version }}
                cache: pip
                cache-dependency-path: backend/requirements.txt

            - name: Install dependencies
              run: python -m pip install --requirement backend/requirements.txt

            - name: Verify TimescaleDB readiness
              run: >-
                docker exec "${{ job.services.db.id }}"
                pg_isready
                --username "$DB_USER"
                --dbname "$DB_NAME"
                
            - name: Run tests
              run: python -m pytest -v